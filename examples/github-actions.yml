# Example customer workflow. Copy this into your own repository as
# .github/workflows/pqgate.yml — it deliberately does not live under .github/
# here, because a file in that directory is a workflow GitHub *runs*, not an
# example it displays.
name: Crypto Compliance Gate
on:
  pull_request:
  push: { branches: [main] }

jobs:
  pqgate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # SARIF upload
      pull-requests: write     # sticky comment
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # Baseline CBOM from the target branch, so the PR comment can show a diff.
      - name: Baseline scan of the target branch
        if: github.event_name == 'pull_request'
        run: |
          git worktree add /tmp/base "origin/${{ github.base_ref }}"
          python3 -m pqgate --no-color scan /tmp/base --fail-on never \
            --cbom "$RUNNER_TEMP/baseline-cbom.json" || true

      - uses: PQgate/pqgate/action@v0.5.0
        with:
          policy: .pqgate.yml
          fail-on: block
          diff-base: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          baseline-cbom: ${{ runner.temp }}/baseline-cbom.json
          version: 0.5.0
          # From the release SHA256SUMS. Leave empty to skip verification.
          checksum: ''
          download-url: ''        # or your internal mirror
